<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>List of employees</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body style="padding-top: 70px;">
    <div th:replace="~{fragments/navbar :: navbar}"></div>
    <div class="container">
        <h2>List of Employees</h2>

        <div th:unless="${#lists.isEmpty(employees)}">

            <table class="table table-striped table-bordered">
                <thead>
                    <tr>
                        <th>First Name</th>
                        <th>Last Name</th>
                        <th>Date of birth</th>
                        <th>Department</th>
                        <th>Salary</th>
                        <th>Manager</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="employee : ${employees}">
                        <td th:text="${employee.firstName}"></td>
                        <td th:text="${employee.lastName}"></td>
                        <td th:text="${employee.dob}"></td>
                        <td th:text="${employee.departmentName}"></td>
                        <td th:text="${employee.salary}"></td>
                        <td th:text="${employee.managerName != null ? employee.managerName : '-'}"></td>
                        <td>
                            <a class="btn btn-sm btn-primary" th:href="@{/employee/getById/{id}(id=${employee.id})}">View</a>
                            <a class="btn btn-sm btn-secondary" href="#">Edit</a>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>

        <p th:if="${#lists.isEmpty(employees)}">No employees found.</p>
    </div>
</body>
</html>
