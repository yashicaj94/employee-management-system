<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Employee Details</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body style="padding-top:70px;">
    <h2 th:text="${employee.id == null ? 'Add Employee' : 'Edit Employee'}"></h2>
    <form th:action="@{/employee/save}" th:object="${employee}" method="post">
        <input type="hidden" th:field="*{id}">
        <label>First Name:</label>
        <input type="text" th:field="*{firstName}" required/>
        <br/>
        <label>Last Name:</label>
        <input type="text" th:field="*{lastName}" required/>
        <br/>
        <label>Date of Birth:</label>
        <input type="date"
               name="dob"
               th:value="${employee.dob != null ? #temporals.format(employee.dob, 'yyyy-MM-dd') : ''}"
               required/>
        <br/>
        <label>Department:</label>
        <select th:field="*{departmentId}" required>
            <option value="">Select Department</option>
            <option th:each="department : ${departments}"
                    th:value="${department.id}"
                    th:text="${department.name}"></option>
        </select>
        <br/>
        <label>Salary:</label>
        <input type="number" step="0.01" th:field="*{salary}" required/>
        <br/>
        <label>Manager:</label>
        <select th:field="*{managerId}">
            <option value="">Select Manager</option>
            <option th:each="manager : ${managers}"
                    th:value="${manager.id}"
                    th:text="${manager.firstName + ' ' + manager.lastName}"></option>
        </select>
        <br/>
        <button type="submit" class="btn btn-primary">Save changes</button>
        <button type="button"
                class="btn btn-secondary"
                onclick="history.back()">
            Cancel
        </button>
    </form>
</body>
</html>
