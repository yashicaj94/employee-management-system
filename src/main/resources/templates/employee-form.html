<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Employee Details</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body style="padding-top:70px;">
<div th:replace="~{fragments/navbar :: navbar}"></div>
<div class="container">
    <h2 th:text="${employee.id == null ? 'Add Employee' : 'Edit Employee'}"></h2>

    <form th:action="@{/employee/save}" th:object="${employee}" method="post">
        <input type="hidden" th:field="*{id}">
        <div class="mb-3">
            <label class="form-label">First Name:</label>
            <input type="text" class="form-control" maxLength="255" th:field="*{firstName}" required/>

            <div class="text-danger"
                 th:if="${#fields.hasErrors('firstName')}"
                 th:errors="*{firstName}">
            </div>
        </div>
        <div class="mb-3">
            <label class="form-label">Last Name:</label>
            <input type="text" class="form-control" maxLength="255" th:field="*{lastName}" required/>

            <div class="text-danger"
                 th:if="${#fields.hasErrors('lastName')}"
                 th:errors="*{lastName}">
            </div>
        </div>
        <div class="mb-3">
            <label class="form-label">Date of Birth:</label>
            <input type="date" class="form-control"
                   th:value="${employee.dob != null ? #temporals.format(employee.dob, 'yyyy-MM-dd') : ''}"
                   th:field="*{dob}"
                   th:max="${#temporals.format(#temporals.createToday().minusDays(1), 'yyyy-MM-dd')}"
                   required/>
            <div class="text-danger"
                 th:if="${#fields.hasErrors('dob')}"
                 th:errors="*{dob}">
            </div>
        </div>
        <div class="mb-3">
            <label class="form-label">Department:</label>
            <select class="form-select" th:field="*{departmentId}" required>
                <option value="">Select Department</option>
                <option th:each="department : ${departments}"
                        th:value="${department.id}"
                        th:text="${department.name}"></option>
            </select>
            <div class="text-danger"
                 th:if="${#fields.hasErrors('departmentId')}"
                 th:errors="*{departmentId}">
            </div>
        </div>
        <div class="mb-3">
            <label class="form-label">Salary:</label>
            <input type="number" class="form-control"
                   step="0.01" min="0.01" max="9999999999.99"
                   th:field="*{salary}"
                   required/>
            <div class="text-danger"
                 th:if="${#fields.hasErrors('salary')}"
                 th:errors="*{salary}">
            </div>
        </div>
        <div class="mb-3">
            <label class="form-label">Manager:</label>
            <select class="form-select" th:field="*{managerId}">
                <option value="">Select Manager</option>
                <option th:each="manager : ${managers}"
                        th:value="${manager.id}"
                        th:text="${manager.firstName + ' ' + manager.lastName}"></option>
            </select>
        </div>
        <div class="d-flex gap-2">
            <button type="submit" class="btn btn-primary">Save changes</button>
            <button type="button"
                    class="btn btn-secondary"
                    onclick="history.back()">
                Cancel
            </button>
        </div>
    </form>
</div>
</body>
</html>
